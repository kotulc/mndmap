name: Verify application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  mdsite:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kotulc/mdsite
          ref: simplify-mdsite
          path: mdsite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - name: Emit publish fixture
        run: node dist/src/cli.js build --root test/fixtures/publish-project
      - name: Apply simplify-mdsite M1 ingest patch
        run: git apply ../test/fixtures/mdsite-m1.patch
        working-directory: mdsite
      - name: Build static site from mndmap destination
        run: node scripts/cli.js build --config ../test/fixtures/publish-project/site/mdsite.yaml
        working-directory: mdsite
        env:
          BASE_PATH: ""
