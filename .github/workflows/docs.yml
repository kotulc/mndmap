name: Verify application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  mndsite:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kotulc/mndsite
          ref: main
          path: mndsite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - name: Emit documentation destination
        run: node dist/src/cli.js build --root .
      - name: Install mndsite dependencies
        run: npm ci
        working-directory: mndsite
      - name: Prepare mndsite public directory
        run: mkdir -p public
        working-directory: mndsite
      - name: Build static site from mndmap destination
        run: node scripts/cli.js build --config ../site/mdsite.yaml
        working-directory: mndsite
        env:
          BASE_PATH: ""
